<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/05-barra-de-progresso/styles.css">
	<!-- defer para garantir que o HTML seja carregado antes do JS -->
	<script src="/05-barra-de-progresso/scripts.js" defer></script>
	<title>Barra de Progresso</title>
</head>

<body>
	<h1>Barra de Progresso</h1>
	<div class="container">
		<div class="progress-bar">
			<div class="progress"></div>
		</div>

		<div class="controls">
			<button id="previous-btn">
				<i class="bi bi-arrow-left"></i> Voltar
			</button>
			<button id="next-btn">Próximo <i class="bi bi-arrow-right"></i></button>
		</div>
	</div>
</body>
</html>
